/* ── motion system · híbrido: base ambiental + pulso de resultado ──
   Un ciclo = 6s. Todo el movimiento ambiental usa periodos que dividen 6s
   (6s · 3s · 2s) para que el loop cierre exacto.
   Ventana de proceso: 2.4–3.6s · Pulso de resultado: 4.0s                */
.aller-g{--L:6s;--amb:cubic-bezier(.37,0,.63,1);--pop:cubic-bezier(.16,1,.3,1);
  position:relative;width:480px;height:501px;overflow:hidden;background:#f9fafb;transform-origin:0 0}
.aller-g *,.aller-g *::before,.aller-g *::after{box-sizing:border-box;margin:0}
.aller-g .fx-raj{font-family:Rajdhani,Arial,sans-serif;font-weight:600}
.aller-g .fx-inter{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:600}
.aller-g .fx-shadow{filter:drop-shadow(0 49px 14.5px rgba(0,0,0,.05)) drop-shadow(0 22px 11px rgba(0,0,0,.09)) drop-shadow(0 5px 6px rgba(0,0,0,.1))}
.aller-g .fx-shadow-sm{filter:drop-shadow(0 18px 5.5px rgba(0,0,0,.05)) drop-shadow(0 8px 4px rgba(0,0,0,.09)) drop-shadow(0 2px 2px rgba(0,0,0,.1))}

/* ── Ambiental ─────────────────────────────────────────── */
/* 1 · Glow neón respira y se enciende en el resultado */
.fx-glow{animation:fx-glow var(--L) var(--amb) infinite;transform-origin:50% 50%}
@keyframes fx-glow{0%,100%{opacity:.7;transform:scaleX(.94)}
  40%{opacity:.85;transform:scaleX(1)}
  67%{opacity:1;transform:scaleX(1.12)}
  85%{opacity:.8;transform:scaleX(1)}}

/* 2 · Tarjetas satélite flotan (±2.5px), cada una con su fase */
.fx-float{animation:fx-float var(--L) var(--amb) infinite}
@keyframes fx-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.fx-d1{animation-delay:0s}.fx-d2{animation-delay:-1s}.fx-d3{animation-delay:-2s}
.fx-d4{animation-delay:-3s}.fx-d5{animation-delay:-4s}.fx-d6{animation-delay:-5s}

/* 3 · Conectores: una banda de señal recorre cada línea punteada (3 por ciclo) */
.fx-flow img{-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.4) 0 38%,#000 50%,rgba(0,0,0,.4) 62% 100%);
  mask-image:linear-gradient(90deg,rgba(0,0,0,.4) 0 38%,#000 50%,rgba(0,0,0,.4) 62% 100%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:fx-flow 2s linear infinite}
.fx-rev img{animation-direction:reverse}
@keyframes fx-flow{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}

/* 4 · Puntos de origen de los conectores laten al salir la señal */
.fx-ping{animation:fx-ping 2s var(--amb) infinite}
.fx-p1{animation-delay:0s}.fx-p2{animation-delay:-.2s}.fx-p3{animation-delay:-.4s}
@keyframes fx-ping{0%,100%{transform:scale(1);opacity:1}12%{transform:scale(1.2);opacity:1}40%{transform:scale(1);opacity:.75}}

/* 5 · Partículas del abanico: fluyen continuo hacia abajo (3 por ciclo por línea) */
.fx-pt{position:absolute;left:0;top:0;width:4px;height:4px;border-radius:50%;background:#646aed;
  box-shadow:0 0 0 1px rgba(255,255,255,.9),0 0 6px rgba(100,106,237,.55);
  offset-rotate:0deg;offset-anchor:center;opacity:0;
  animation:fx-pt-move 2s cubic-bezier(.4,0,.8,1) infinite,fx-pt-fade 2s linear infinite}
@keyframes fx-pt-move{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes fx-pt-fade{0%{opacity:0}18%{opacity:1}82%{opacity:1}100%{opacity:0}}
/* ráfaga sincronizada: todas las líneas llegan juntas al pulso (4.0s) */
.fx-pt.fx-burst{width:5px;height:5px;background:#646aed;
  box-shadow:0 0 0 1.5px #fff,0 0 8px 2px rgba(213,254,0,.9);
  animation:fx-burst var(--L) linear infinite}
@keyframes fx-burst{0%,52%{offset-distance:0%;opacity:0;animation-timing-function:linear}
  52.01%{offset-distance:0%;opacity:1;animation-timing-function:cubic-bezier(.5,0,.9,1)}
  66.67%{offset-distance:100%;opacity:1}
  69%,100%{offset-distance:100%;opacity:0}}

/* 6 · Nodo de convergencia: respira (3s) + onda de choque en el resultado */
.fx-node img{animation:fx-node var(--L) var(--amb) infinite}
@keyframes fx-node{0%,100%{transform:scale(1)}25%{transform:scale(1.08)}50%{transform:scale(1)}
  64%{transform:scale(.92)}69%{transform:scale(1.28);animation-timing-function:var(--pop)}80%{transform:scale(1)}}
.fx-shock{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  border:1.5px solid #646aed;box-shadow:0 0 10px rgba(213,254,0,.8),inset 0 0 6px rgba(213,254,0,.6);
  opacity:0;animation:fx-shock var(--L) linear infinite;pointer-events:none}
@keyframes fx-shock{0%,66.6%{transform:scale(.4);opacity:0}
  66.7%{transform:scale(.5);opacity:.9;animation-timing-function:var(--pop)}
  82%{transform:scale(3.2);opacity:0}100%{opacity:0}}

/* ── Pulso de resultado ────────────────────────────────── */
.fx-pill-wrap{isolation:isolate}
.fx-pill-wrap::before{content:"";position:absolute;inset:0 6px;border-radius:24px;background:#d5ef14;
  filter:blur(14px);opacity:0;z-index:-1;animation:fx-bloom var(--L) linear infinite}
@keyframes fx-bloom{0%,66%{opacity:0;transform:scale(.8)}
  71%{opacity:.8;transform:scale(1.05);animation-timing-function:var(--amb)}92%,100%{opacity:0;transform:scale(1)}}
.fx-pill{animation:fx-pill var(--L) linear infinite}
@keyframes fx-pill{0%,66%{transform:translateY(0) scale(1);animation-timing-function:var(--pop)}
  70%{transform:translateY(-2px) scale(1.035);animation-timing-function:var(--amb)}
  84%,100%{transform:translateY(0) scale(1)}}

/* Checks: "tick" — se contraen y rebotan. Se programan con --at (segundos del ciclo) */
.fx-pop{animation:fx-pop var(--L) linear infinite;animation-delay:calc(var(--at,4s) - var(--L))}
@keyframes fx-pop{0%{transform:scale(1)}
  2%{transform:scale(.6);animation-timing-function:var(--pop)}
  7%{transform:scale(1.25);animation-timing-function:var(--amb)}
  12%,100%{transform:scale(1)}}
.fx-pop-pill{--at:3.95s}.fx-pop-a1{--at:4.2s}.fx-pop-a2{--at:4.35s}.fx-pop-out{--at:4.5s}

/* Accesibilidad: sin movimiento, se muestra el diseño estático */
@media (prefers-reduced-motion:reduce){
  .aller-g *,.aller-g *::before,.aller-g *::after{animation:none!important}
  .aller-g .fx-pt,.aller-g .fx-shock{display:none}}

/* Clear Direction · proceso: la prioridad se define y el icono de flujos da un giro completo */
.fx-bar{transform-origin:0 50%;animation:g1-bar var(--L) linear infinite}
@keyframes g1-bar{0%,38%{transform:scaleX(.3);animation-timing-function:var(--pop)}
  60%{transform:scaleX(1)}88%{transform:scaleX(1);animation-timing-function:var(--amb)}100%{transform:scaleX(.3)}}
.fx-flows{animation:g-proc var(--L) linear infinite;transform-origin:28px 36px}
@keyframes g-proc{0%,40%{transform:rotate(0);animation-timing-function:cubic-bezier(.65,0,.35,1)}60%,100%{transform:rotate(360deg)}}

<script>
(()=>{
  const wrap=document.querySelector('.aller-g-embed'),g=wrap.firstElementChild;
  const q=new URLSearchParams(location.search),stage=q.get('stage');
  if(stage){ // render para redes: lienzo fijo, gráfico centrado y escalado
    const [W,H]=stage.split('x').map(Number),s=+(q.get('scale')||2);
    document.body.classList.add('stage');
    Object.assign(document.body.style,{width:W+'px',height:H+'px'});
    Object.assign(wrap.style,{width:480*s+'px',height:501*s+'px',left:(W-480*s)/2+'px',top:(H-501*s)/2+'px'});
    wrap.style.setProperty('--s',s);
  }else{
    const fit=()=>wrap.style.setProperty('--s',wrap.clientWidth/480);
    new ResizeObserver(fit).observe(wrap);fit();
  }
  // Seek determinista (usado para exportar MP4): pausa todo y va al segundo t del ciclo
  window.__seek=t=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000;});
})();
</script>
